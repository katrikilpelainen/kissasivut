<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>JSON-datan käsittelyä</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
        }

        h1,
        h2,
        h3 {
            color: #c45b87;
        }

        .card {
            border-color: #f3b6cc;
        }

        img {
            max-width: 500px;
            width: 100%;
            height: auto;
        }
    </style>
</head>

<body>

    <nav class="navbar navbar-expand-lg" style="background-color: #f8c8dc;">
        <div class="container">

            <a class="navbar-brand" href="../index.html">
                Katrin kissasivut
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="../index.html">
                    Etusivulle
                </a>

                <a class="nav-link" href="index.html">
                    JSON-tehtävä
                </a>

                <a class="nav-link" href="poke.html">
                    Pokemon haku
                </a>

                <a class="nav-link" href="saa.html">
                    Helsingin sää
                </a>

            </div>

        </div>
    </nav>


    <main class="container py-5">

        <div id="vastaus">
            <p>Ladataan JSON-tietoja...</p>
        </div>

    </main>


    <script>

        fetch('tietue.json')

            .then(function (response) {
                return response.json();
            })

            .then(function (responseJson) {
                kerro(responseJson);
            })

            .catch(function (error) {
                document.getElementById("vastaus").innerHTML =
                    "<p>Tietoa ei pystytä hakemaan.</p>";

                console.error(error);
            });


        function kerro(obj) {

            let tiedot =
                "<h1>" + obj.otsikko + "</h1>" +
                "<p>" + obj.kuvaus + "</p>" +
                "<hr>";


            tiedot +=
                "<p>" +
                "<img src='" + obj.kuva + "' alt='Digitekniikat'>" +
                "</p>";


            tiedot +=
                "<h3>Opintojakso</h3>" +
                "Nimi: " + obj.opintojakso.nimi + "<br>" +
                "Tunnus: " + obj.opintojakso.tunnus + "<br>" +
                "Opintopisteet: " + obj.opintojakso.opintopisteet +
                "<br>";


            tiedot += "<h3>Sisältö</h3>";

            tiedot += "<ul>";

            for (var i = 0; i < obj.sisalto.length; i++) {

                tiedot +=
                    "<li>" +
                    obj.sisalto[i] +
                    "</li>";
            }

            tiedot += "</ul>";


            tiedot += "<h3>Tekniikat</h3>";

            for (var i = 0; i < obj.tekniikat.length; i++) {

                tiedot +=
                    "<b>Aihe: " +
                    obj.tekniikat[i].aihe +
                    "</b><br>";

                tiedot +=
                    "<a href='" +
                    obj.tekniikat[i].linkki +
                    "' target='_blank'>" +
                    obj.tekniikat[i].linkki +
                    "</a>";

                tiedot += "<br><br>";
            }


            document.getElementById("vastaus").innerHTML = tiedot;
        }

    </script>

</body>

</html>
