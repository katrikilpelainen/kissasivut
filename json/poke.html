<!DOCTYPE html>
<html lang="fi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokemon haku</title>

    <!-- Bootstrap-tyylit -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <style>
        body {
            background-color: #ffffff;
        }

        h1,
        h2,
        h3 {
            color: #c45b87;
        }

        .navbar {
            background-color: #f8c8dc;
        }

        .navbar-brand,
        .nav-link {
            color: #5a2942;
        }

        .btn-primary {
            background-color: #e88bb3;
            border-color: #e88bb3;
        }

        .btn-primary:hover {
            background-color: #d96f9c;
            border-color: #d96f9c;
        }

        #kuva2 img {
            max-width: 250px;
        }

        .pokemon-box {
            max-width: 600px;
            margin: auto;
            text-align: center;
        }
    </style>
</head>

<body>

    <!-- Sivuston navigaatio -->
    <nav class="navbar navbar-expand-lg">
        <div class="container">

            <a class="navbar-brand" href="../index.html">
                Katrin kissasivut
            </a>

            <div class="navbar-nav ms-auto">

                <a class="nav-link" href="../index.html">
                    Etusivulle
                </a>

                <a class="nav-link" href="index.html">
                    JSON-tehtävä
                </a>

                <a class="nav-link" href="poke.html">
                    Pokemon haku
                </a>

                <a class="nav-link" href="saa.html">
                    Helsingin sää
                </a>

            </div>
        </div>
    </nav>


    <!-- Pokemon-haun sisältö -->
    <main class="container py-5">

        <div class="pokemon-box">

            <h1>Pokemon haku</h1>

            <p>
                <input type="text"
                    id="pokemonName"
                    class="form-control mb-2"
                    placeholder="Enter Pokemon name">

                <button onclick="poke()" class="btn btn-primary">
                    Hae
                </button>
            </p>

            <div id="nimi">
                Kirjoita laatikkoon Pokemonin nimi
            </div>

            <p id="kuva2"></p>

            <div id="kaanto"></div>

            <div id="ominaisuudet"></div>

        </div>

    </main>


    <script>

        // Tallennetaan haetun Pokemonin nimi.
        let name = "";


        // Haetaan Pokemon PokeAPI-palvelusta.
        function poke() {

            // Haetaan hakukentän arvo ja muutetaan se pieniksi kirjaimiksi.
            const pokeName =
                document.getElementById("pokemonName").value.toLowerCase();

            // Tallennetaan käyttäjän kirjoittama nimi.
            name =
                document.getElementById("pokemonName").value;


            // Tarkistetaan, että käyttäjä on kirjoittanut Pokemonin nimen.
            if (pokeName === "") {

                document.getElementById("nimi").innerHTML =
                    "Kirjoita ensin Pokemonin nimi.";

                return;
            }


            // Haetaan Pokemonin tiedot PokeAPI-rajapinnasta.
            fetch("https://pokeapi.co/api/v2/pokemon/" + pokeName)

                // Tarkistetaan palvelimelta saatu vastaus.
                .then(function (response) {

                    if (!response.ok) {
                        throw new Error("Pokemonia ei löytynyt");
                    }

                    // Muutetaan vastaus JSON-olioksi.
                    return response.json();

                })

                // Lähetetään JSON-olio pokekuva-funktiolle.
                .then(function (responseJson) {

                    pokekuva(responseJson);

                })

                // Näytetään virheilmoitus, jos Pokemonia ei löydy.
                .catch(function (error) {

                    document.getElementById("nimi").innerHTML =
                        "Pokemonia ei löytynyt.";

                    document.getElementById("kuva2").innerHTML = "";

                    document.getElementById("kaanto").innerHTML = "";

                    document.getElementById("ominaisuudet").innerHTML = "";

                });

        }


        // Näytetään haetun Pokemonin kuva ja nimi.
        function pokekuva(obj) {

            // Haetaan Pokemonin etupuolen kuvan osoite.
            let pokeurl = obj.sprites.front_default;

            document.getElementById("kuva2").innerHTML =
                "<img src='" + pokeurl + "' alt='" + name + "'>";

            document.getElementById("nimi").innerHTML =
                "<h2>" + name + "</h2>";

            // Luodaan Käännä-painike.
            document.getElementById("kaanto").innerHTML =
                "<button onclick='kaanna()' class='btn btn-primary'>Käännä</button>";

            // Tyhjennetään ominaisuudet uuden haun yhteydessä.
            document.getElementById("ominaisuudet").innerHTML = "";

            // Tyhjennetään hakukenttä.
            document.getElementById("pokemonName").value = "";

        }


        // Haetaan Pokemon uudelleen ja näytetään sen takapuolen kuva.
        function kaanna() {

            const pokeName = name.toLowerCase();

            fetch("https://pokeapi.co/api/v2/pokemon/" + pokeName)

                // Muutetaan vastaus JSON-olioksi.
                .then(function (response) {

                    return response.json();

                })

                // Käsitellään Pokemonin tiedot.
                .then(function (obj) {

                    // Haetaan Pokemonin takapuolen kuva.
                    let pokeurl = obj.sprites.back_default;

                    // Käytetään vaihtoehtoista kuvaa, jos takakuvaa ei löydy.
                    if (!pokeurl) {
                        pokeurl = obj.sprites.back_shiny;
                    }

                    // Vaihdetaan etupuolen kuva takapuolen kuvaan.
                    document.getElementById("kuva2").innerHTML =
                        "<img src='" + pokeurl + "' alt='" + name + "'>";

                    // Näytetään kolme Pokemonin ominaisuutta.
                    document.getElementById("ominaisuudet").innerHTML =
                        "<h3>Pokemonin ominaisuudet</h3>" +
                        "<p><b>Korkeus:</b> " + obj.height + "</p>" +
                        "<p><b>Paino:</b> " + obj.weight + "</p>" +
                        "<p><b>Perus kokemuspisteet:</b> " + obj.base_experience + "</p>";

                })

                // Näytetään virheilmoitus, jos tietoja ei saada haettua.
                .catch(function (error) {

                    document.getElementById("ominaisuudet").innerHTML =
                        "<p>Pokemonin tietoja ei pystytä hakemaan.</p>";

                });

        }

    </script>

</body>

</html>
